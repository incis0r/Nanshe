name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The nanshe-vm crate is a workspace member; on Linux its unit tests run with the guest-reading code enabled.
# "nanshe vm" itself is not exercised here (it needs a KVM host with a guest).
jobs:
  linux:
    name: "Linux (container): unit and end-to-end tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: |
          docker run --rm -v "$PWD":/src -v nanshe-target:/target -e CARGO_TARGET_DIR=/target -w /src \
            docker.io/library/rust:1-slim-bookworm cargo test --workspace --features nanshe-cli/llm,nanshe-cli/vm
      - name: End-to-end tests (synthetic samples, live scan inside the container)
        run: |
          docker run --rm --cap-add SYS_PTRACE -v "$PWD":/src -v nanshe-target:/target -e CARGO_TARGET_DIR=/target -w /src \
            docker.io/library/rust:1-slim-bookworm sh -c "apt-get update -qq && apt-get install -y -qq gdb >/dev/null && sh scripts/e2e.sh /target/e2e-out" | tee e2e.log; rc=${PIPESTATUS[0]}
          # failing lines become annotations of the run, readable without opening the log
          grep -E "FAIL|ROZNE|POMIN" e2e.log | head -40 | while IFS= read -r line; do echo "::error title=e2e::$line"; done
          exit $rc

  windows:
    name: "Windows: build and unit tests"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: cargo test --workspace --features nanshe-cli/llm
      - name: Release build
        run: cargo build --release -p nanshe-cli -p nanshe-samples --features nanshe-cli/llm

  macos:
    name: "macOS: unit tests"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: cargo test --workspace --features nanshe-cli/llm

  fuzz:
    name: "Fuzzing: short run of every target"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install nightly --profile minimal && cargo install cargo-fuzz --locked
      - name: One minute per target
        run: |
          for t in dump pediff pagetables maps detectors wintables llm report; do
            echo "::group::$t"
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -max_len=65536 -timeout=20 -rss_limit_mb=2048 || { echo "::error title=fuzz::target $t failed"; exit 1; }
            echo "::endgroup::"
          done
