[workspace]
resolver = "2"
members = ["crates/*", "tests/samples"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha2 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["json"] }
libc = "0.2"
url = "2"

[profile.release]
lto = "thin"
strip = true

# Skróty SHA-256 liczone są przy każdym skanie; bez optymalizacji build testowy jest na tyle wolny,
# że testy zależne od czasu (próbki dynamiczne) gubią fazy.
[profile.dev.package.sha2]
opt-level = 3
