[package]
name = "nanshe-samples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "nanshe-sample"
path = "src/main.rs"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
